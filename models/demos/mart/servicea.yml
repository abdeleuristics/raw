version: 2

models:
  - name: servicea
    config:
      meta:
        tags: ["prod"]
        order_fields_by: 'index'

    columns:
      - name: date
        meta:
          dimension:
            type: timestamp
            time_intervals: ['HOUR', 'DAY', 'WEEK', 'MONTH', 'QUARTER', 'YEAR']
            label: 'Date'

      - name: channel
        meta:
          dimension:
            type: string
            label: 'Channel'
            description: 'Marketing channel (Facebook Ads, Instagram Ads, Organic, Google Ads, Tiktok Ads)'

      - name: country
        meta:
          dimension:
            type: string
            label: 'Country'
            description: 'Country where the campaign is running'

      - name: city
        meta:
          dimension:
            type: string
            label: 'City'
            description: 'City where the campaign is running'

      - name: sales_rep
        meta:
          dimension:
            type: string
            label: 'Sales Rep'
            description: 'Sales representative name'

      - name: account_manager
        meta:
          dimension:
            type: string
            label: 'Account Manager'
            description: 'Account manager name'

      - name: spend
        meta:
          dimension:
            type: number
            hidden: true
            label: 'Spend'
          metrics:
            total_spend:
              type: sum
              label: 'Total Spend'
              format: '$#,##0.00'
            avg_spend:
              type: average
              label: 'Average Spend'
              format: '$#,##0.00'

      - name: impression
        meta:
          dimension:
            type: number
            hidden: true
            label: 'Impressions'
          metrics:
            total_impressions:
              type: sum
              label: 'Total Impressions'
              format: '#,##0'

      - name: cpm
        meta:
          dimension:
            type: number
            hidden: true
            label: 'CPM'
          metrics:
            avg_cpm:
              type: average
              label: 'Average CPM'
              format: '$#,##0.00'

      - name: unique_visitors
        meta:
          dimension:
            type: number
            hidden: true
            label: 'Unique Visitors'
          metrics:
            total_unique_visitors:
              type: sum
              label: 'Total Unique Visitors'
              format: '#,##0'

      - name: click_through_rate
        meta:
          dimension:
            type: number
            hidden: true
            label: 'Click Through Rate'
          metrics:
            avg_click_through_rate:
              type: average
              label: 'Average CTR'
              format: '#,##0.00%'

      - name: opt_ins
        meta:
          dimension:
            type: number
            hidden: true
            label: 'Opt-ins'
          metrics:
            total_opt_ins:
              type: sum
              label: 'Total Opt-ins'
              format: '#,##0'

      - name: landing_page_conversion
        meta:
          dimension:
            type: number
            hidden: true
            label: 'Landing Page Conversion'
          metrics:
            avg_landing_page_conversion:
              type: average
              label: 'Average Landing Page Conversion'
              format: '#,##0.00%'

      - name: number_of_bookings
        meta:
          dimension:
            type: number
            hidden: true
            label: 'Number of Bookings'
          metrics:
            total_bookings:
              type: sum
              label: 'Total Bookings'
              format: '#,##0'

      - name: number_of_showups
        meta:
          dimension:
            type: number
            hidden: true
            label: 'Number of Showups'
          metrics:
            total_showups:
              type: sum
              label: 'Total Showups'
              format: '#,##0'

      - name: show_up_rate
        meta:
          dimension:
            type: number
            hidden: true
            label: 'Show Up Rate'
          metrics:
            avg_show_up_rate:
              type: average
              label: 'Average Show Up Rate'
              format: '#,##0.00%'

      - name: close_rate
        meta:
          dimension:
            type: number
            hidden: true
            label: 'Close Rate'
          metrics:
            avg_close_rate:
              type: average
              label: 'Average Close Rate'
              format: '#,##0.00%'

      - name: customer_acquisition_cost
        meta:
          dimension:
            type: number
            hidden: true
            label: 'Customer Acquisition Cost'
          metrics:
            avg_customer_acquisition_cost:
              type: average
              label: 'Average CAC'
              format: '$#,##0.00'

      - name: customer_lifetime_value
        meta:
          dimension:
            type: number
            hidden: true
            label: 'Customer Lifetime Value'
          metrics:
            avg_customer_lifetime_value:
              type: average
              label: 'Average CLV'
              format: '$#,##0.00'

      - name: cac_payback_period
        meta:
          dimension:
            type: number
            hidden: true
            label: 'CAC Payback Period'
          metrics:
            avg_cac_payback_period:
              type: average
              label: 'Average CAC Payback Period (Days)'
              format: '#,##0'

      - name: time_to_conversion
        meta:
          dimension:
            type: number
            hidden: true
            label: 'Time to Conversion'
          metrics:
            avg_time_to_conversion:
              type: average
              label: 'Average Time to Conversion (Days)'
              format: '#,##0'

              